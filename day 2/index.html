<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Layout Practice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <h1>My Website</h1>

        <ul class="nav-links">
          <li><a href="#home">Home</a></li>
          <li><a href="#cards">Cards</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main id="home">
      <h2>My Learning Cards</h2>

      <section class="card-grid" id="cards">
        <article class="card">
          <h3>HTML</h3>
          <p>HTML gives structure to a webpage.</p>
        </article>

        <article class="card">
          <h3>CSS</h3>
          <p>CSS makes a webpage look attractive.</p>
        </article>

        <article class="card">
          <h3>JavaScript</h3>
          <p>JavaScript adds interactivity to a webpage.</p>
        </article>
      </section>
    </main>

    <footer id="contact">
      <p>My CSS Practice Project</p>
    </footer>
  </body>
</html>
