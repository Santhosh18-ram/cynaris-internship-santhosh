
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Webpage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>My Website</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="home">
    <h2>Welcome to My Website</h2>
    <p>This webpage adjusts to mobile, tablet, and desktop screens.</p>

    <section class="cards" id="about">
      <article class="card">
        <h3>HTML</h3>
        <p>HTML creates the structure of a webpage.</p>
      </article>

      <article class="card">
        <h3>CSS</h3>
        <p>CSS styles the webpage and makes it responsive.</p>
      </article>

      <article class="card">
        <h3>JavaScript</h3>
        <p>JavaScript adds interactive features.</p>
      </article>
    </section>
  </main>

  <footer id="contact">
    <p>My Responsive Design Project</p>
  </footer>

</body>
</html>
